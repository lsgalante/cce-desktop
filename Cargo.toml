[package]
name = "cce-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "1d38cc1346f892b862ad452ae525c77b8314eeb3", features = ["markdown"] }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
log = "0.4"
env_logger = "0.11"
# Dropped desktop images: PNG and JPEG cover what a browser hands over. The
# same pair cce-files and cce-preview already decode with.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cce-vault = { git = "https://github.com/lsgalante/cce-vault.git", rev = "5bec1038dc74780664463f072e759c002a8f1b24" }

[dev-dependencies]
tempfile = "3"
